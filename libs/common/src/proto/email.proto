syntax = "proto3";

package email;

service EmailService {
  rpc SendOtpEmail (SendOtpEmailRequest) returns (EmailResponse);
}

message SendOtpEmailRequest {
  string email = 1;
  string otp = 2;
  string name = 3; // Optional, for personalization
}

message EmailResponse {
  bool success = 1;
  string message = 2;
}
