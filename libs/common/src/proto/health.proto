syntax = "proto3";

package health;



message LogEntry {
  int32 id = 1; // Clients local ID
  float heart_rate = 2;
  float spo2 = 3;
  float temperature = 4;
  int64 timestamp = 5;
  float acc_x = 6;
  float acc_y = 7;
  float acc_z = 8;
  float g_total = 9;
  float ambient_temp = 10;
  float moisture = 11;
  bool sos = 12;
  bool fall_alert = 13;
  string gait_label = 14;
}

message SyncLogsRequest {
  int32 user_id = 1;
  repeated LogEntry logs = 2;
}


message SyncLogsResponse {
  bool success = 1;
  string message = 2;
  int32 synced_count = 3;
}

message GetLogDatesRequest {
  int32 user_id = 1;
}

message GetLogDatesResponse {
  repeated string dates = 1; // List of dates in YYYY-MM-DD format
}

message DateRangeRequest {
  int32 user_id = 1;
  string start_date = 2; // ISO 8601
  string end_date = 3;   // ISO 8601
}

message GetLogsByDateRangeResponse {
  repeated LogEntry logs = 1;
}

service HealthService {
  rpc SyncLogs (SyncLogsRequest) returns (SyncLogsResponse);
  rpc GetLogDates (GetLogDatesRequest) returns (GetLogDatesResponse);
  rpc GetLogsByDateRange (DateRangeRequest) returns (GetLogsByDateRangeResponse);
}
