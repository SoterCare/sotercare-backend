version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: auth-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      # Local only: never expose the dev database (default credentials) beyond this machine.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: auth-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-backend
    env_file:
      - .env
    ports:
      # Only the public HTTP/Socket.IO API is published. The gRPC services
      # (50051-50054) are internal: they have no authentication and trust the
      # caller-supplied user id, and the gateway reaches them on localhost
      # inside this container (GAP-013).
      - "3000:3000"
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      # All services are co-located in this single image, so the gateway reaches
      # each microservice on localhost at its gRPC port.
      - AUTH_SERVICE_URL=127.0.0.1:50051
      - EMAIL_SERVICE_URL=127.0.0.1:50052
      - SUMMARY_GRPC_URL=localhost:50053
      - HEALTH_SERVICE_URL=127.0.0.1:50054
      # Bind the internal gRPC servers to loopback (the ai-summary-service binds
      # [::] in code; it is still unreachable from the host because 50053 is
      # not published).
      - AUTH_GRPC_URL=127.0.0.1:50051
      - EMAIL_GRPC_URL=127.0.0.1:50052
      - SUMMARY_GRPC_PORT=50053
      - HEALTH_GRPC_URL=127.0.0.1:50054
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
