version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: auth-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: auth-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-backend
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "50051:50051"
      - "50052:50052"
      - "50053:50053"
      # M6: health-service runs on 50054 — expose it too (was previously omitted).
      - "50054:50054"
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      # All services are co-located in this single image, so the gateway reaches
      # each microservice on localhost at its gRPC port.
      - AUTH_SERVICE_URL=localhost:50051
      - EMAIL_SERVICE_URL=localhost:50052
      - SUMMARY_GRPC_URL=localhost:50053
      - HEALTH_SERVICE_URL=localhost:50054
      - AUTH_GRPC_URL=0.0.0.0:50051
      - EMAIL_GRPC_URL=0.0.0.0:50052
      - SUMMARY_GRPC_PORT=50053
      - HEALTH_GRPC_URL=0.0.0.0:50054
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
